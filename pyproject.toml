[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandclaude"
version = "0.3.0"
description = "Self-hosted async execution engine for Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "sandclaude contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "docker>=7.0",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "mcp>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "claude-agent-sdk>=0.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
sandclaude = "sandclaude.cli:main"
sandclaude-mcp = "sandclaude.mcp_plugin.server:main"

[project.urls]
Homepage = "https://github.com/kosaki-kamui/sandclaude"
Repository = "https://github.com/kosaki-kamui/sandclaude"
Issues = "https://github.com/kosaki-kamui/sandclaude/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sandclaude = ["templates/*.html"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
disallow_untyped_decorators = false

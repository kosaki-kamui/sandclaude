# sandclaude: Review PRs with AI
#
# When a PR is opened, this workflow submits the diff to sandclaude's
# review endpoint and posts the findings as a PR comment.
#
# Prerequisites:
# - A running sandclaude server accessible from GitHub Actions
# - Repository secrets: SANDCLAUDE_URL, SANDCLAUDE_TOKEN
# - GITHUB_TOKEN (automatic) for posting PR comments
#
# Usage: Copy this file to your repo's .github/workflows/ directory.

name: "sandclaude: Review PR"

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Submit task for review
        env:
          SANDCLAUDE_URL: ${{ secrets.SANDCLAUDE_URL }}
          SANDCLAUDE_TOKEN: ${{ secrets.SANDCLAUDE_TOKEN }}
        run: |
          TASK=$(curl -s -X POST "$SANDCLAUDE_URL/tasks" \
            -H "Authorization: Bearer $SANDCLAUDE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo\": \"https://github.com/${{ github.repository }}.git\",
              \"branch\": \"${{ github.head_ref }}\",
              \"prompt\": \"Review this branch for bugs, security issues, and missing tests. Do not make changes — only analyze.\",
              \"max_turns\": 10,
              \"policy_preset\": \"review-only\"
            }")
          TASK_ID=$(echo "$TASK" | jq -r .id)
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
        id: submit

      - name: Wait for review completion
        env:
          SANDCLAUDE_URL: ${{ secrets.SANDCLAUDE_URL }}
          SANDCLAUDE_TOKEN: ${{ secrets.SANDCLAUDE_TOKEN }}
        run: |
          TASK_ID="${{ steps.submit.outputs.task_id }}"
          for i in $(seq 1 40); do
            STATUS=$(curl -s "$SANDCLAUDE_URL/tasks/$TASK_ID" \
              -H "Authorization: Bearer $SANDCLAUDE_TOKEN" | jq -r .status)
            if [ "$STATUS" = "completed" ] || [ "$STATUS" = "failed" ]; then
              break
            fi
            sleep 15
          done

      - name: Post review as PR comment
        env:
          SANDCLAUDE_URL: ${{ secrets.SANDCLAUDE_URL }}
          SANDCLAUDE_TOKEN: ${{ secrets.SANDCLAUDE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TASK_ID="${{ steps.submit.outputs.task_id }}"

          # Get risk summary
          RISK=$(curl -s "$SANDCLAUDE_URL/tasks/$TASK_ID/risk" \
            -H "Authorization: Bearer $SANDCLAUDE_TOKEN")

          # Get AI review
          REVIEW=$(curl -s -X POST "$SANDCLAUDE_URL/tasks/$TASK_ID/review" \
            -H "Authorization: Bearer $SANDCLAUDE_TOKEN")

          RISK_LEVEL=$(echo "$RISK" | jq -r .risk_level)
          SUMMARY=$(echo "$REVIEW" | jq -r '.review.summary // "Review not available"')

          COMMENT="## sandclaude Review

**Risk Level:** $RISK_LEVEL

$SUMMARY

<details><summary>Full review details</summary>

\`\`\`json
$(echo "$REVIEW" | jq .review)
\`\`\`

</details>

---
*Generated by [sandclaude](https://github.com/kosaki-kamui/sandclaude)*"

          gh pr comment ${{ github.event.pull_request.number }} --body "$COMMENT"
